name: security
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run workflow command
        run: mvn -B -ntp -DskipTests verify
