name: build-pr-merge
on:
  pull_request:
    types: [closed]
    branches:
      - main
jobs:
  build_pr_merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run workflow command
        run: mvn -B -ntp -DskipTests package
