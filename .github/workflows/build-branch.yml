name: build-branch
on:
  push:
    branches-ignore:
      - main
jobs:
  build_branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run workflow command
        run: mvn -B -ntp clean verify
